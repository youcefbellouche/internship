# Single Connectivity TN - CU-CP Configuration
cu_cp:
  request_pdu_session_timeout: 30
  inactivity_timer: 7200
  amf:
    addrs: 127.0.0.5
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
    - tac: 1
      plmn_list:
      - plmn: '99970'
        tai_slice_support_list:
        - sst: 1
  e1ap:
    bind_addrs: 127.0.20.1
  f1ap:
    bind_addrs: 127.0.10.1
  rrc:
    rrc_procedure_guard_time_ms: 5000
log:
  filename: /tmp/single_tn_20mhz_cu_cp.log
  all_level: debug

qos:
  - five_qi: 9
    pdcp:
      tx:
        sn: 18
        discard_timer: -1
        status_report_required: false
      rx:
        sn: 18
        t_reordering: 15
        out_of_order_delivery: false
    f1u_cu_up:
      backoff_timer: 5
    f1u_du:
      backoff_timer: 5
    rlc:
      mode: am
      am:
        tx:
          sn: 18
          t-poll-retransmit: 100
          max-retx-threshold: 32
          poll-pdu: -1
          poll-byte: -1
          queue-size: 16384
          queue-bytes: 6172672
        rx:
          sn: 18
          t-reassembly: 10
          t-status-prohibit: 10
