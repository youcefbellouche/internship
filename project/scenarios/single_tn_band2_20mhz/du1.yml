# Single Connectivity TN 20MHz (Band 2, SCS 15kHz, 106 PRBs)
gnb_du_id: 1
f1ap:
  addrs: 127.0.10.1
  bind_addrs: 127.0.10.2
f1u:
  socket:
  - bind_addr: 127.0.10.2
ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 0
  rx_gain: 0
cell_cfg:
  sector_id: 1
  dl_arfcn: 392000
  band: 2
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: '99970'
  tac: 1
  pci: 1
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 12
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
    nof_ssb_per_ro: 1
    nof_cb_preambles_per_ssb: 64
  pdsch:
    mcs_table: qam256
    min_ue_mcs: 25
    max_ue_mcs: 26
  pusch:
    mcs_table: qam256
log:
  filename: /tmp/single_tn_band2_20mhz_du1.log
  all_level: debug
