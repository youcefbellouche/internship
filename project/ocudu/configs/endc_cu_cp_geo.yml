# CU-CP configuration with extended RRC procedure guard time for NTN GEO links
# and 2-hour inactivity timer to prevent premature session tear-down
cu_cp:
  rrc:
    rrc_procedure_guard_time_ms: 12800
  inactivity_timer: 7200
  amf:
    addrs: 127.0.0.5
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99970"
            tai_slice_support_list:
              - sst: 1
  e1ap:
    bind_addrs: 127.0.20.1
  f1ap:
    bind_addrs: 127.0.10.1
log:
  filename: /tmp/endc_cu_cp.log
  all_level: debug
